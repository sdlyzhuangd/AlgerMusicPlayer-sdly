<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoverBg 算法验证</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 20px; }

  /* 与应用 styles.css 完全一致的背景层实现 */
  .cover-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg-color, #f5f5f5);
    z-index: 80;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden; /* 与应用一致的裁剪，防溢出 */
  }
  .cover-overlay::before {
    content: '';
    position: absolute;
    inset: -60px;
    background-image: var(--cover-bg, none);
    background-size: cover;
    background-position: center;
    filter: blur(50px);
    z-index: 0;
    pointer-events: none;
  }
  .cover-overlay::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--cover-scrim, rgba(0,0,0,0.18));
    z-index: 0;
    pointer-events: none;
  }
  [data-theme="dark"] .cover-overlay::after {
    background: var(--cover-scrim, rgba(0,0,0,0.45));
  }
  .cover-overlay > * {
    position: relative;
    z-index: 1;
  }
  .cover-overlay img { width: 240px; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
  .cover-overlay h2 { margin-top: 12px; font-size: 20px; }
  .cover-overlay p  { margin-top: 4px; opacity: 0.75; }

  #result {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 200;
    background: rgba(0,0,0,0.85);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-family: Consolas, monospace;
    white-space: pre-wrap;
    max-width: 460px;
  }
  .ok { color: #7CFC00; }
  .bad { color: #FF6B6B; }
</style>
</head>
<body>
<div class="cover-overlay" id="overlay">
  <img id="cover" src="../test_cover.jpg" alt="测试封面">
  <h2 id="title">取色算法验证</h2>
  <p id="sub">封面模糊铺底 + 主色渐变遮罩</p>
</div>
<div id="result">测试中...</div>

<script>
// ===== 与 app.js 相同的取色实现（复制验证） =====
const overlay = document.getElementById('overlay')
const result = document.getElementById('result')
const logs = []

function _lightenColor(color, factor) {
  return {
    r: Math.min(255, Math.floor(color.r + (255 - color.r) * factor)),
    g: Math.min(255, Math.floor(color.g + (255 - color.g) * factor)),
    b: Math.min(255, Math.floor(color.b + (255 - color.b) * factor))
  }
}
function _getBrightness(r, g, b) {
  return Math.round((r * 299 + g * 587 + b * 114) / 1000)
}
function _buildCoverScrim(dominant, theme) {
  if (!dominant) {
    return theme === 'dark' ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.2)'
  }
  if (theme === 'dark') {
    const c = { r: Math.floor(dominant.r * 0.4), g: Math.floor(dominant.g * 0.4), b: Math.floor(dominant.b * 0.4) }
    const alpha = 0.55
    return `linear-gradient(to bottom, rgba(${c.r},${c.g},${c.b},${alpha}), rgba(${c.r},${c.g},${c.b},${(alpha * 0.5).toFixed(2)}))`
  } else {
    let c = _lightenColor(dominant, 0.5)
    const br = _getBrightness(c.r, c.g, c.b)
    if (br < 100) {
      const rate = 100 / br
      c = { r: Math.min(255, Math.floor(c.r * rate)), g: Math.min(255, Math.floor(c.g * rate)), b: Math.min(255, Math.floor(c.b * rate)) }
    }
    const alpha = 0.6
    return `linear-gradient(to bottom, rgba(${c.r},${c.g},${c.b},${alpha}), rgba(${c.r},${c.g},${c.b},${(alpha * 0.5).toFixed(2)}))`
  }
}
async function _extractDominantColor(url) {
  const resp = await fetch(url)
  if (!resp.ok) throw new Error('HTTP ' + resp.status)
  const buf = await resp.arrayBuffer()
  const blob = new Blob([buf], { type: resp.headers.get('content-type') || 'image/jpeg' })
  const objUrl = URL.createObjectURL(blob)
  const img = new Image()
  await new Promise((resolve, reject) => {
    img.onload = resolve
    img.onerror = () => reject(new Error('图片解码失败'))
    img.src = objUrl
  })
  URL.revokeObjectURL(objUrl)
  const maxSize = 100
  const scale = Math.min(maxSize / img.naturalWidth, maxSize / img.naturalHeight, 1)
  const canvas = document.createElement('canvas')
  canvas.width = Math.max(1, Math.floor(img.naturalWidth * scale))
  canvas.height = Math.max(1, Math.floor(img.naturalHeight * scale))
  const ctx = canvas.getContext('2d')
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height)
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data
  const colorCount = {}
  let dominant = { r: 0, g: 0, b: 0 }
  let maxCount = 0
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 128) continue
    const r = data[i] >> 3 << 3
    const g = data[i + 1] >> 3 << 3
    const b = data[i + 2] >> 3 << 3
    const key = `${r},${g},${b}`
    colorCount[key] = (colorCount[key] || 0) + 1
    if (colorCount[key] > maxCount) {
      maxCount = colorCount[key]
      dominant = { r, g, b }
    }
  }
  return dominant
}

async function run() {
  try {
    const url = '../test_cover.jpg'
    // 1) 模糊层
    overlay.style.setProperty('--cover-bg', `url('${url}')`)
    logs.push('[1] 模糊层 --cover-bg 已设置: OK')

    // 2) 浅色主题取色
    document.documentElement.dataset.theme = 'light'
    const d1 = await _extractDominantColor(url)
    const s1 = _buildCoverScrim(d1, 'light')
    overlay.style.setProperty('--cover-scrim', s1)
    logs.push(`[2] 浅色主题 主色 rgb(${d1.r},${d1.g},${d1.b})`)
    logs.push(`    遮罩: ${s1}`)
    await new Promise(r => setTimeout(r, 400))

    // 3) 深色主题取色（复用同一次取色，仅换遮罩算法）
    document.documentElement.dataset.theme = 'dark'
    const s2 = _buildCoverScrim(d1, 'dark')
    overlay.style.setProperty('--cover-scrim', s2)
    logs.push(`[3] 深色主题 遮罩: ${s2}`)

    // 4) 校验渲染结果
    const before = getComputedStyle(overlay, '::before')
    const after = getComputedStyle(overlay, '::after')
    logs.push(`[4] ::before background-image: ${before.backgroundImage.slice(0, 60)}...`)
    logs.push(`    ::before filter: ${before.filter}`)
    logs.push(`    ::after background: ${after.background.slice(0, 80)}...`)
    logs.push('[DONE] 全部通过')
    result.innerHTML = logs.map(l => `<span class="ok">✓</span> ${l}`).join('<br>')
  } catch (e) {
    result.innerHTML = `<span class="bad">✗ 失败: ${e.message}</span><br>` + logs.map(l => `· ${l}`).join('<br>')
  }
}
run()
</script>
</body>
</html>
